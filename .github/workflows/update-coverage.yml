name: Refresh coverage data

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC — adjust to taste
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest data from Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}   # e.g. https://constantinople.atlassian.net/wiki
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}         # Atlassian API token
          CONFLUENCE_PAGE_ID: "2775810251"
        run: node scripts/update-data.mjs

      - name: Commit updated data.json if it changed
        run: |
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-refresh coverage data"
          git push
